name: Revisar la nube

# Botón manual para ver QUÉ HAY en Supabase cuando un teléfono enseña algo que
# no cuadra. Mirar el código dice lo que debería pasar; esto dice lo que pasa.
# No escribe nada: solo lee e imprime cuentas. Ver la nota sobre privacidad en
# la cabecera de diagnostico_nube.py — este repositorio es público.
on:
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Revisar
        run: python3 diagnostico_nube.py
