<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXONTECH · Diagnóstico de conexión</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;line-height:1.5}
h1{font-size:19px;margin-bottom:4px;color:#fff}
.sub{font-size:12.5px;color:#94a3b8;margin-bottom:16px}
button{width:100%;padding:15px;font-size:16px;font-weight:800;border:none;border-radius:12px;background:#0ea5e9;color:#fff;cursor:pointer;margin-bottom:14px}
button:disabled{background:#475569}
.t{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 14px;margin-bottom:9px}
.tn{font-size:13.5px;font-weight:700;color:#f1f5f9;margin-bottom:3px}
.td{font-size:11.5px;color:#94a3b8;margin-bottom:6px}
.tr{font-size:13px;font-weight:800;font-family:ui-monospace,monospace;word-break:break-word}
.ok{color:#4ade80}.bad{color:#f87171}.wait{color:#fbbf24}
#final{margin-top:16px;padding:14px;border-radius:12px;font-size:14px;font-weight:700;display:none;line-height:1.55}
#copy{background:#334155;font-size:14px;padding:13px;display:none}
</style>
</head>
<body>
<h1>🔍 Diagnóstico AXONTECH</h1>
<div class="sub">Prueba desde ESTA conexión (hazlo <b>sin VPN</b>) qué canales funcionan de verdad.</div>
<button id="run" onclick="runAll()">▶ Empezar prueba</button>
<div id="tests"></div>
<div id="final"></div>
<button id="copy" onclick="copyRes()">📋 Copiar resultados</button>

<script>
var PROJ='axontech', KEY='AIzaSyBIyvayDYLYDFy4qrbTkYnrTmxfvxvLnlU';
var FS='https://firestore.googleapis.com/v1/projects/'+PROJ+'/databases/(default)/documents';

var TESTS=[
 {id:'fs_read', n:'1. Firestore · LEER (HTTPS)', d:'Es como el admin recibe los vales en la v30.',
  run:function(){ return fetch(FS+'/gestores?pageSize=1&key='+KEY).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(j){
    return 'OK · '+((j.documents||[]).length)+' doc'; }); }},

 {id:'fs_write', n:'2. Firestore · ESCRIBIR (HTTPS)', d:'Es como el gestor envía el vale en la v29/v30. LO MÁS IMPORTANTE.',
  run:function(){ var id='probe'+Date.now();
    return fetch(FS+':commit?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({writes:[{update:{name:'projects/'+PROJ+'/databases/(default)/documents/_diagnostico/'+id,
        fields:{prueba:{stringValue:'ok'},ts:{stringValue:new Date().toISOString()}}}}]})})
    .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t.slice(0,120)); });
      return fetch(FS+':commit?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({writes:[{'delete':'projects/'+PROJ+'/databases/(default)/documents/_diagnostico/'+id}]})})
        .then(function(){ return 'OK · escribió y borró'; }); }); }},

 {id:'fs_stream', n:'3. Firestore · canal en tiempo real', d:'El canal que sospecho bloqueado. Si falla, es normal: la v30 ya no depende de él.',
  run:function(){ return fetch('https://firestore.googleapis.com/google.firestore.v1.Firestore/Listen/channel?VER=8&database=projects%2F'+PROJ+'%2Fdatabases%2F(default)',
     {method:'GET',mode:'no-cors'}).then(function(){ return 'Respondió (alcanzable)'; }); }},

 {id:'github', n:'4. GitHub API', d:'Ya lo usas para fotos y catálogo. Si funciona, es un canal comprobado.',
  run:function(){ return fetch('https://api.github.com/rate_limit').then(function(r){
     if(!r.ok) throw new Error('HTTP '+r.status); return 'OK'; }); }},

 {id:'cf_worker', n:'5. Cloudflare Workers', d:'El destino si hay que migrar. Cualquier respuesta = alcanzable.',
  run:function(){ return fetch('https://axon-probe-test.workers.dev/',{mode:'no-cors'})
     .then(function(){ return 'Alcanzable'; }); }},

 {id:'cf_gen', n:'6. Cloudflare (red general)', d:'Comparación.',
  run:function(){ return fetch('https://cloudflare-dns.com/dns-query?name=example.com&type=A',
     {headers:{'accept':'application/dns-json'}}).then(function(r){
     if(!r.ok) throw new Error('HTTP '+r.status); return 'OK'; }); }}
];

var res={};
function el(id){return document.getElementById(id);}
function render(){
  el('tests').innerHTML=TESTS.map(function(t){
    var r=res[t.id]||{s:'wait',m:'— esperando —'};
    var c=r.s==='ok'?'ok':(r.s==='bad'?'bad':'wait');
    var ic=r.s==='ok'?'✅':(r.s==='bad'?'❌':'⏳');
    return '<div class="t"><div class="tn">'+t.n+'</div><div class="td">'+t.d+
      '</div><div class="tr '+c+'">'+ic+' '+r.m+'</div></div>';
  }).join('');
}
function runAll(){
  el('run').disabled=true; el('run').textContent='Probando…';
  res={}; render();
  var i=0;
  function next(){
    if(i>=TESTS.length){ done(); return; }
    var t=TESTS[i++]; var t0=Date.now();
    var to=new Promise(function(_,rej){ setTimeout(function(){rej(new Error('sin respuesta en 15s (bloqueado)'));},15000); });
    Promise.race([t.run(),to]).then(function(m){
      res[t.id]={s:'ok',m:m+' · '+(Date.now()-t0)+'ms'};
    })['catch'](function(e){
      res[t.id]={s:'bad',m:(e&&e.message?e.message:'falló')+' · '+(Date.now()-t0)+'ms'};
    }).then(function(){ render(); next(); });
  }
  render(); next();
}
function done(){
  el('run').disabled=false; el('run').textContent='▶ Repetir prueba';
  var w=res.fs_write&&res.fs_write.s==='ok', r=res.fs_read&&res.fs_read.s==='ok';
  var okCount=0; TESTS.forEach(function(t){ if(res[t.id]&&res[t.id].s==='ok') okCount++; });
  var f=el('final'); f.style.display='block';
  if(okCount===0){ // ninguno pasó → no es Firestore, es que no hay internet
    f.style.background='#78350f'; f.style.color='#fde68a';
    f.innerHTML='⚠️ <b>Falló TODO, incluso sitios no relacionados.</b><br>Eso no señala a Firestore: parece que en este momento no hay salida a internet (o está cortada del todo). Revisa la conexión y repite la prueba.'; }
  else if(w&&r){ f.style.background='#064e3b'; f.style.color='#a7f3d0';
    f.innerHTML='✅ <b>Firestore funciona por HTTPS desde aquí.</b><br>No hace falta migrar. Si la app igual falla, el problema está en el código y con esto lo puedo ubicar.'; }
  else { f.style.background='#7f1d1d'; f.style.color='#fecaca';
    f.innerHTML='❌ <b>Firestore NO funciona desde aquí, pero otros sitios SÍ.</b><br>Eso confirma bloqueo específico y que hay que cambiar de proveedor. Mira cuáles dieron ✅ arriba (GitHub / Cloudflare) — ese será el nuevo destino.'; }
  el('copy').style.display='block';
}
function copyRes(){
  var t='DIAGNOSTICO AXONTECH '+new Date().toLocaleString('es-ES')+'\n';
  TESTS.forEach(function(x){ var r=res[x.id]||{s:'?',m:'-'};
    t+=(r.s==='ok'?'OK  ':'FALLA ')+x.n+' -> '+r.m+'\n'; });
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){alert('Copiado. Pégalo en el chat.');},
    function(){alert(t);}); else alert(t);
}
render();
</script>
</body>
</html>
